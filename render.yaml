services:
  - type: web
    name: sales-intelligence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_GEMINI
        value: "false"
      - key: NLP_CONFIDENCE_THRESHOLD
        value: "0.45"
